CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y
CONFIG_MAIN_STACK_SIZE=2048

# Match the artifact name copy.sh / board.cmake expect
# (./build/zephyr/NPCM4.npcm.bin) so this test image can be flashed
# with the same script used for the chip-test app, without editing it.
CONFIG_KERNEL_BIN_NAME="NPCM4"

# Run from SRAM (not XIP). Required so soc/nuvoton/npcm/common/CMakeLists.txt
# links in rom_hooks.ld and the Rom_hook2 GPIO50-strap recovery/download-mode
# hook is baked into the image header. Without this, esiost.py cannot find
# the .rom_hooks ELF section and there is no way to force the board back
# into recovery mode after flashing this test image.
CONFIG_XIP=n
