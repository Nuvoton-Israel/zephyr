description: Nuvoton, NPCM-GPIO node

compatible: "nuvoton,npcm-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true
  ngpios:
    required: true
  nuvoton,index:
    type: int
    required: true
    description: The index of the gpio device.
  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
