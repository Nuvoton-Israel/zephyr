description: |
  Nuvoton NPCM pin function table.

  Pin multiplexing on NPCM is controlled by the System Configuration (SCFG) block. Each pin
  has a selection table whose DEVALTx bit values select one of its functions. For example,
  DEVALT7[6], DEVALTB[6], and DEVALT6D[7] select GPIO17 functions: 1xx selects CLKOUT, 01x
  selects RIA, 001 selects I2C6B_SDA, and 000 selects GPIO17. A function can also have a
  pull-up/down enable bit and a low-voltage select bit in SCFG.

  Every child of this node describes one row of a pin selection table: the SCFG bits that
  select a function and its pull and voltage controls. The SoC provides these nodes in
  npcm<n>-pinfunc.dtsi, one file per series; boards select them by phandle from a
  nuvoton,npcm-pinctrl node.

  Example, the GPIO17 rows above:

    &pinfunc {
      /omit-if-no-ref/ pin_gpio17_gpio: pin-gpio17-gpio {
        nuvoton,alts = <NPCM_SCFG_DEVALT6D 7 0>,
                       <NPCM_SCFG_DEVALTB 6 0>,
                       <NPCM_SCFG_DEVALT7 6 0>;
      };
      /omit-if-no-ref/ pin_gpio17_sda6b: pin-gpio17-sda6b {
        nuvoton,alts = <NPCM_SCFG_DEVALT6D 7 1>,
                       <NPCM_SCFG_DEVALTB 6 0>,
                       <NPCM_SCFG_DEVALT7 6 0>;
        nuvoton,pull-up-reg = <NPCM_SCFG_DEVPD1 4>;
        nuvoton,low-voltage-reg = <NPCM_SCFG_LV_CTL3 7>;
      };
    };

  Functions selected by a strap rather than by SCFG bits have no nuvoton,alts property.

compatible: "nuvoton,npcm-pinfunc"

include: base.yaml

child-binding:
  description: One selectable function of one pin.

  properties:
    nuvoton,alts:
      type: array
      description: |
        SCFG bits that select this function, as <register bit value> triplets. The register
        is an offset from the SCFG base, given with the NPCM_SCFG_* macros. Every bit of the
        pin's selection table is listed, including the ones that must be zero, so that
        writing the whole row selects exactly this function.

    nuvoton,pull-up-reg:
      type: array
      description: |
        <register bit> of the SCFG enable for this function's internal pull-up resistor.
        Present only on functions that have one. A pin configuration enables it with
        bias-pull-up.

    nuvoton,pull-down-reg:
      type: array
      description: |
        <register bit> of the SCFG enable for this function's internal pull-down resistor.
        Present only on functions that have one. A pin configuration enables it with
        bias-pull-down.

    nuvoton,low-voltage-reg:
      type: array
      description: |
        <register bit> of the SCFG low-voltage select for this function. Present only on
        functions that can run at 1.8V. A pin configuration picks the level with
        nuvoton,voltage-level-mv.
